apiVersion: v1
kind: Service
metadata:
  name: student-service
  namespace: w07
spec:
  selector:
    app: student-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: health
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
  namespace: w07
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: student-service
          image: w07/student-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: health
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: w07-config
            - secretRef:
                name: w07-secrets
          env:
            - name: DB_NAME
              value: student_db
            - name: GRPC_ADDRESS
              value: 0.0.0.0:50051
            - name: HEALTH_PORT
              value: "3001"
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: w07
spec:
  selector:
    app: course-service
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: health
      port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: w07
spec:
  replicas: 2
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
      containers:
        - name: course-service
          image: w07/course-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
            - name: health
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: w07-config
            - secretRef:
                name: w07-secrets
          env:
            - name: DB_NAME
              value: course_db
            - name: GRPC_ADDRESS
              value: 0.0.0.0:50052
            - name: HEALTH_PORT
              value: "3002"
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
---
