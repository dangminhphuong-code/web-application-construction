syntax = "proto3";

package course;

service CourseService {
  rpc GetCourse(GetCourseRequest) returns (CourseResponse);
  rpc BatchGetCourses(BatchGetCoursesRequest) returns (BatchGetCoursesResponse);
  rpc ListCourses(ListCoursesRequest) returns (ListCoursesResponse);
  rpc CreateCourse(CreateCourseRequest) returns (CourseResponse);
  rpc ApplyEnrollmentConfirmed(ApplyEnrollmentConfirmedRequest) returns (ApplyEnrollmentConfirmedResponse);
}

message Course {
  int32 id = 1;
  string title = 2;
  string description = 3;
  string status = 4;
  int32 enrolled_count = 5;
  int32 capacity = 6;
}

message GetCourseRequest {
  int32 id = 1;
}

message CourseResponse {
  Course course = 1;
}

message BatchGetCoursesRequest {
  repeated int32 ids = 1;
}

message BatchGetCoursesResponse {
  repeated Course courses = 1;
}

message CreateCourseRequest {
  string title = 1;
  string description = 2;
  int32 capacity = 3;
}

message ListCoursesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message PageInfo {
  int32 total = 1;
  int32 limit = 2;
  int32 offset = 3;
  bool has_next_page = 4;
  bool has_previous_page = 5;
}

message ListCoursesResponse {
  repeated Course courses = 1;
  PageInfo page_info = 2;
}

message ApplyEnrollmentConfirmedRequest {
  string event_id = 1;
  int32 enrollment_id = 2;
  string student_id = 3;
  int32 course_id = 4;
}

message ApplyEnrollmentConfirmedResponse {
  bool success = 1;
  string message = 2;
}
