services:
  db:
    image: postgres:15-alpine
    container_name: w06_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: student_db
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d postgres"]
      interval: 5s
      timeout: 30s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  db-init:
    image: postgres:15-alpine
    container_name: w06_db_init
    environment:
      PGPASSWORD: "123456"
    command: >
      sh -c "
        until pg_isready -h db -U admin -d postgres; do sleep 2; done;
        psql -h db -U admin -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'student_db'\" | grep -q 1 || psql -h db -U admin -d postgres -c \"CREATE DATABASE student_db\";
        psql -h db -U admin -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'course_db'\" | grep -q 1 || psql -h db -U admin -d postgres -c \"CREATE DATABASE course_db\";
        psql -h db -U admin -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'enrollment_db'\" | grep -q 1 || psql -h db -U admin -d postgres -c \"CREATE DATABASE enrollment_db\";
        psql -h db -U admin -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'chat_db'\" | grep -q 1 || psql -h db -U admin -d postgres -c \"CREATE DATABASE chat_db\";
      "
    depends_on:
      db:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    container_name: w06_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: w06_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - redis_data:/data

  student-service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    container_name: w06_student_service
    env_file:
      - services/student-service/.env.docker
    ports:
      - "50051:50051"
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
    depends_on:
      db-init:
        condition: service_completed_successfully

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    container_name: w06_course_service_1
    env_file:
      - services/course-service/.env.docker
    environment:
      INSTANCE_NAME: course-1
    ports:
      - "50052:50052"
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  course-service-replica:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    container_name: w06_course_service_2
    env_file:
      - services/course-service/.env.docker
    environment:
      GRPC_ADDRESS: 0.0.0.0:50062
      HEALTH_PORT: 3012
      INSTANCE_NAME: course-2
    command: node src/server.js
    ports:
      - "50062:50062"
      - "3012:3012"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3012/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
    depends_on:
      course-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  course-nginx:
    image: nginx:1.27-alpine
    container_name: w06_course_nginx
    ports:
      - "15052:50052"
    volumes:
      - ./nginx/course-service.grpc.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      course-service:
        condition: service_healthy
      course-service-replica:
        condition: service_healthy

  enrollment-service:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
    container_name: w06_enrollment_service
    env_file:
      - services/enrollment-service/.env.docker
    ports:
      - "50053:50053"
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
    depends_on:
      db-init:
        condition: service_completed_successfully
      course-nginx:
        condition: service_started

  enrollment-outbox-worker:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
    container_name: w06_enrollment_outbox_worker
    env_file:
      - services/enrollment-service/.env.docker
    command: npm run worker:outbox
    depends_on:
      rabbitmq:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy

  course-enrollment-consumer:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    container_name: w06_course_enrollment_consumer
    env_file:
      - services/course-service/.env.docker
    command: npm run consumer:enrollment
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      course-service:
        condition: service_healthy

  course-outbox-worker:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    container_name: w06_course_outbox_worker
    env_file:
      - services/course-service/.env.docker
    command: npm run worker:outbox
    depends_on:
      rabbitmq:
        condition: service_healthy
      course-service:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: w06_notification_service
    env_file:
      - services/notification-service/.env.docker
    ports:
      - "3004:3004"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      course-outbox-worker:
        condition: service_started

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: w06_chat_service
    env_file:
      - services/chat-service/.env.docker
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
    depends_on:
      db-init:
        condition: service_completed_successfully

  graphql-server:
    build:
      context: .
      dockerfile: graphql-server/Dockerfile
    container_name: w06_graphql_gateway
    env_file:
      - graphql-server/.env.docker
    ports:
      - "4000:4000"
    depends_on:
      student-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      course-service-replica:
        condition: service_healthy
      course-nginx:
        condition: service_started
      enrollment-service:
        condition: service_healthy
      enrollment-outbox-worker:
        condition: service_started
      course-enrollment-consumer:
        condition: service_started
      course-outbox-worker:
        condition: service_started

volumes:
  db_data:
  rabbitmq_data:
  redis_data: